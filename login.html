<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | The Nocturnal Concierge</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed-dim": "#b9c7df",
                      "on-surface": "#e5e1e4",
                      "on-primary-fixed": "#001945",
                      "tertiary-fixed": "#6ffbbe",
                      "primary-fixed-dim": "#b0c6ff",
                      "on-primary": "#002c6f",
                      "on-tertiary-fixed-variant": "#005236",
                      "on-secondary": "#233144",
                      "surface-dim": "#131315",
                      "on-secondary-container": "#abb9d1",
                      "outline": "#8b91a0",
                      "error": "#ffb4ab",
                      "secondary": "#b9c7df",
                      "on-secondary-fixed-variant": "#3a485b",
                      "surface-container-highest": "#353437",
                      "background": "#131315",
                      "on-primary-fixed-variant": "#00419c",
                      "inverse-on-surface": "#313032",
                      "surface-container-low": "#1c1b1d",
                      "outline-variant": "#414754",
                      "error-container": "#93000a",
                      "surface-bright": "#39393b",
                      "on-error-container": "#ffdad6",
                      "primary-fixed": "#d9e2ff",
                      "inverse-primary": "#0058cc",
                      "on-surface-variant": "#c0c6d6",
                      "secondary-fixed": "#d5e3fc",
                      "surface-container-lowest": "#0e0e10",
                      "secondary-container": "#3c4a5e",
                      "tertiary": "#4edea3",

                      "on-error": "#690005",

              "borderRadius": {
                      "DEFAULT": "0.125rem",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(57, 57, 59, 0.6);
            backdrop-filter: blur(24px);
        }
        .ghost-border {
            outline: 1px solid rgba(65, 71, 84, 0.15);
        }
        .bg-mesh {
            background-color: #131315;
            background-image: 
                radial-gradient(at 0% 0%, rgba(176, 198, 255, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(86, 140, 255, 0.05) 0px, transparent 50%);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col bg-mesh">
<!-- Hero Background Texture (Visual Polish) -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-tertiary/5 rounded-full blur-[120px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex-grow flex flex-col items-center justify-center p-6">
<!-- Branding Header -->
<header class="mb-12 text-center">
<div class="flex items-center justify-center gap-3 mb-4">
<span class="material-symbols-outlined text-primary text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">nightlight</span>
<h1 class="text-xl font-black italic tracking-tighter text-primary uppercase">Nocturnal</h1>
</div>
<p class="text-xs font-label uppercase tracking-[0.2em] text-on-surface-variant">Grand Hotel Management</p>
</header>
<!-- Login Card -->
<section class="glass-panel w-full max-max-w-md p-10 rounded-xl shadow-[0px_12px_32px_rgba(0,0,0,0.5)] border border-outline-variant/10">
<div class="mb-10">
<h2 class="text-2xl font-headline font-bold text-on-surface mb-2">Concierge Access</h2>
<p class="text-sm text-on-surface-variant">Enter your credentials to manage the estate.</p>
</div>
<form action="#" class="space-y-8">
<!-- Username Field -->
<div class="space-y-2">
<label class="block text-[10px] font-label font-bold uppercase tracking-[0.15em] text-on-surface-variant">Username</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors text-lg">person</span>
<input class="w-full bg-surface-container-lowest border-none outline-none focus:ring-1 focus:ring-primary/40 rounded-lg py-4 pl-12 pr-4 text-sm text-on-surface placeholder:text-outline-variant transition-all ghost-border" placeholder="Hotel Associate ID" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="block text-[10px] font-label font-bold uppercase tracking-[0.15em] text-on-surface-variant">Security Key</label>
<a class="text-[10px] font-label font-bold uppercase tracking-[0.05em] text-primary hover:text-primary-container transition-colors" href="#">Forgot Key?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-primary transition-colors text-lg">lock</span>
<input class="w-full bg-surface-container-lowest border-none outline-none focus:ring-1 focus:ring-primary/40 rounded-lg py-4 pl-12 pr-4 text-sm text-on-surface placeholder:text-outline-variant transition-all ghost-border" placeholder="••••••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<!-- Remember Me & Options -->
<div class="flex items-center">
<label class="flex items-center cursor-pointer group">
<div class="relative">
<input class="sr-only peer" type="checkbox"/>
<div class="w-5 h-5 bg-surface-container-highest rounded border border-outline-variant/30 peer-checked:bg-primary peer-checked:border-primary transition-all"></div>
<span class="material-symbols-outlined absolute inset-0 text-[16px] text-on-primary scale-0 peer-checked:scale-100 transition-transform flex items-center justify-center font-bold">check</span>
</div>
<span class="ml-3 text-xs font-medium text-on-surface-variant group-hover:text-on-surface transition-colors">Keep me logged in</span>
</label>
</div>
<!-- Sign In Button -->
<button class="w-full py-4 rounded-lg bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold text-sm uppercase tracking-widest shadow-lg shadow-primary/10 hover:shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
</section>
<!-- Footer -->
<footer class="mt-12 text-center">
<p class="text-[10px] font-label uppercase tracking-[0.1em] text-outline-variant">
                © 2024 Nocturnal Systems <span class="mx-2">|</span> Encrypted Enterprise Environment
            </p>
</footer>
</main>
<!-- Side Decoration (Editorial Moment) -->
<div class="hidden lg:block fixed left-12 top-1/2 -translate-y-1/2 vertical-text">
<span class="text-[10px] font-label font-black uppercase tracking-[1em] text-outline-variant/30 [writing-mode:vertical-lr] rotate-180">PRECISION SERVICE • NOCTURNAL GRAND</span>
</div>
<!-- Background Imagery for Texture -->
<div class="fixed inset-0 -z-10 opacity-10 grayscale mix-blend-overlay">
<img alt="" class="w-full h-full object-cover" data-alt="luxury hotel exterior at night with warm golden window lights and sleek dark architectural lines against deep blue sky" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBS1uMQvkasHRayjfCsIBCIJLwqERtW6w-31h7vsSl4XrgZhzGoUcB9jg-qc5HedlydEvhj3w9DZmvyTFdZD6Pu70668efr3U0pI4BHSBHaLyrzCjrh5ODnjou0DGEf0T6xV7rN5CTKofRAbm_aEe_qUhM05J19bQRhtULJfcs2c7MfhzxAFKRXG-OeqNH9XilXN8RMEGs3wxoMWru7oUrp0kkkfFMZwCNu7dh4hwwRRTQnxgO2TR-oLw-cZRDTdirahT0KoU4ztmg"/>
</div>
</body></html>
